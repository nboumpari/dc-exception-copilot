<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DC Exception Copilot</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f6f6f4; --surface: #ffffff; --ink: #1b1b1a; --ink-2: #5a5955; --line: #e2e1dc;
    --accent: #2a78d6; --accent-ink: #ffffff; --warn-bg: #fff4e5; --warn-ink: #8a4b00;
    --ok: #1b7f4b; --bad: #b3261e; --chip: #eef3fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --surface: #20201f; --ink: #f2f1ec; --ink-2: #b5b3ab; --line: #34332f;
      --accent: #5b9be8; --accent-ink: #0b1220; --warn-bg: #3a2a12; --warn-ink: #f4c27a;
      --ok: #5fcf93; --bad: #f2867f; --chip: #1f2a3a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--surface); border-bottom: 1px solid var(--line);
           padding: 12px 16px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  header .meta { color: var(--ink-2); font-size: 13px; }
  header button { margin-left: auto; }
  main { max-width: 860px; margin: 0 auto; padding: 16px 16px 140px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { background: var(--chip); color: var(--ink); border: 1px solid var(--line);
          border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .msg { margin: 12px 0; }
  .user { text-align: right; }
  .user .bubble { display: inline-block; background: var(--accent); color: var(--accent-ink);
                  padding: 8px 12px; border-radius: 14px 14px 4px 14px; max-width: 85%; text-align: left; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card .answer p:first-child { margin-top: 0; }
  .card table { border-collapse: collapse; } .card td, .card th { border: 1px solid var(--line); padding: 4px 8px; }
  .cites { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .cite { font-size: 12px; background: var(--chip); border-radius: 6px; padding: 2px 8px; color: var(--ink-2); }
  details { margin-top: 10px; color: var(--ink-2); font-size: 13px; }
  code { font-size: 12px; word-break: break-word; }
  .warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 8px 10px; margin-top: 10px; font-size: 13px; }
  .approval { border-color: var(--accent); }
  .approval h3 { margin: 0 0 8px; font-size: 15px; }
  .approval .field { color: var(--ink-2); font-size: 13px; margin: 2px 0; }
  .approval textarea { width: 100%; min-height: 160px; margin: 8px 0; font: inherit; font-size: 14px;
                       padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line);
           background: var(--surface); color: var(--ink); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .decided { font-size: 13px; margin-top: 8px; }
  .decided.ok { color: var(--ok); } .decided.bad { color: var(--bad); }
  form.ask { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface);
             border-top: 1px solid var(--line); padding: 12px 16px; }
  form.ask .inner { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; }
  form.ask input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 8px;
                   border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .thinking { color: var(--ink-2); font-style: italic; }
  .error { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>DC Exception Copilot</h1>
  <span class="meta" id="meta">connecting…</span>
  <button type="button" id="new">New conversation</button>
</header>

<main>
  <div class="examples" id="examples"></div>
  <div id="log" aria-live="polite"></div>
</main>

<form class="ask" id="form">
  <div class="inner">
    <input id="q" autocomplete="off" placeholder="Ask about shipments, hazmat, procedures…" aria-label="Question">
    <button class="primary" id="send">Ask</button>
  </div>
</form>

<script>
const EXAMPLES = [
  "Is SHP-01209 OK to load tomorrow?",
  "Can SHP-01210 go out tomorrow?",
  "Check SHP-01211 before it leaves.",
  "Is SHP-01212 at risk of leaving late?",
  "What should receiving watch out for with tomorrow's inbound from Delta Copack?",
  "Email Cardinal Carriers to confirm the trailer for SHP-01212.",
];
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("q");
let threadId = null;
let apiKey = localStorage.getItem("copilotApiKey") || "";

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function markdown(text) {  // answers may quote documents: sanitize before inserting
  return DOMPurify.sanitize(marked.parse(text || ""));
}
function scrollDown() { window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); }

async function api(path, body) {
  const headers = { "Content-Type": "application/json" };
  if (apiKey) headers["X-API-Key"] = apiKey;
  const res = await fetch(path, { method: body ? "POST" : "GET", headers,
                                  body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401) {
    apiKey = prompt("This server requires an API key:") || "";
    localStorage.setItem("copilotApiKey", apiKey);
    return api(path, body);
  }
  const text = await res.text();  // errors are not always JSON (e.g. a proxy's HTML page)
  let data = null;
  try { data = JSON.parse(text); } catch { /* keep text */ }
  if (!res.ok) throw new Error((data && data.detail) || `${res.status} ${res.statusText}`);
  return data;
}

function renderResponse(r, container) {
  container.replaceChildren();
  if (r.answer) {
    const ans = el("div", "answer"); ans.innerHTML = markdown(r.answer); container.append(ans);
  }
  if (r.citations.length) {
    const c = el("div", "cites");
    r.citations.forEach(x => c.append(el("span", "cite", x)));
    container.append(c);
  }
  if (r.unverified_citations.length) {
    container.append(el("div", "warn", "Could not verify: " + r.unverified_citations.join(", ")));
  }
  if (r.tool_calls.length) {
    const d = el("details"); d.append(el("summary", null, `Tools used (${r.tool_calls.length})`));
    r.tool_calls.forEach(t => {
      const line = el("div"); line.append(el("code", null, `${t.name}(${JSON.stringify(t.args)})`));
      d.append(line);
    });
    container.append(d);
  }
  if (r.pending_action) container.append(approvalCard(r));
}

function approvalCard(r) {
  const p = r.pending_action;
  const card = el("div", "card approval"); card.style.marginTop = "12px";
  card.append(el("h3", null, `Approval needed: ${p.action_type} to ${p.recipient}`));
  card.append(el("div", "field", "Subject: " + p.subject));
  card.append(el("div", "field", "Reason: " + p.reason));
  const body = el("textarea"); body.value = p.body; body.setAttribute("aria-label", "Message body");
  card.append(body);
  const row = el("div", "row");
  const ok = el("button", "primary", "Approve & send"); ok.type = "button";
  const no = el("button", null, "Reject"); no.type = "button";
  row.append(ok, no); card.append(row);
  async function decide(approved) {
    ok.disabled = no.disabled = body.disabled = true;
    const comment = approved ? "" : (prompt("Reason for rejecting (optional):") || "");
    const edited = approved && body.value !== p.body ? body.value : null;
    const status = el("div", "decided " + (approved ? "ok" : "bad"),
                      approved ? "Approved - sending (simulated)…" : "Rejected.");
    card.append(status);
    try {
      const res = await api(`/threads/${r.thread_id}/approve`,
                            { approved, comment, edited_body: edited, approver: "chat user" });
      status.textContent = approved ? "Approved - sent (simulated)." : "Rejected - nothing was sent.";
      const follow = el("div", "card"); follow.style.marginTop = "12px";
      renderResponse(res, follow); card.after(follow); scrollDown();
    } catch (e) { status.textContent = "Error: " + e.message; status.className = "decided bad"; }
  }
  ok.onclick = () => decide(true);
  no.onclick = () => decide(false);
  return card;
}

async function ask(question) {
  const u = el("div", "msg user"); u.append(el("span", "bubble", question)); log.append(u);
  const wrap = el("div", "msg"); const card = el("div", "card");
  card.append(el("div", "thinking", "Checking data, rules and procedures…"));
  wrap.append(card); log.append(wrap); scrollDown();
  document.getElementById("send").disabled = true;
  try {
    const r = await api("/ask", { question, thread_id: threadId });
    threadId = r.thread_id;
    renderResponse(r, card);
  } catch (e) {
    card.replaceChildren(el("div", "error", "Error: " + e.message));
  } finally {
    document.getElementById("send").disabled = false; scrollDown();
  }
}

form.onsubmit = e => {
  e.preventDefault();
  const q = input.value.trim(); if (!q) return;
  input.value = ""; ask(q);
};
document.getElementById("new").onclick = () => { threadId = null; log.replaceChildren(); input.focus(); };
EXAMPLES.forEach(x => {
  const b = el("button", "chip", x); b.type = "button"; b.onclick = () => ask(x);
  document.getElementById("examples").append(b);
});
api("/health").then(h => {
  document.getElementById("meta").textContent =
    `${h.chat_model} · reasoning ${h.reasoning_effort} · simulation time ${h.simulation_time}`;
}).catch(() => { document.getElementById("meta").textContent = "API not reachable"; });
</script>
</body>
</html>
