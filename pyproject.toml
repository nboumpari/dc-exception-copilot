[project]
name = "dc-exception-copilot"
version = "0.1.0"
description = "Agentic RAG assistant for warehouse / distribution-center exception handling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic-settings>=2.4",
    "pymupdf>=1.28.2",
    "tiktoken>=0.14.0",
    "lxml>=6.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/copilot/synthetic/sds.py" = ["C408"]  # dict(...) reads better for SDS profiles
