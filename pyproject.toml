[project]
name = "dc-exception-copilot"
version = "0.1.0"
description = "Agentic RAG assistant for warehouse / distribution-center exception handling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic-settings>=2.4",
    "pymupdf>=1.28.2",
    "tiktoken>=0.14.0",
    "lxml>=6.1.3",
    "openai>=3.32.0",
    "chromadb>=1.5.9",
    "bm25s>=0.3.13",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.4.6",
    "langsmith>=0.14.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
notebook = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/copilot/synthetic/sds.py" = ["C408"]  # dict(...) reads better for SDS profiles
