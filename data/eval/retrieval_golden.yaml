# Golden set for RETRIEVAL evaluation (step 4).
#
# Each question is phrased the way a DC employee would ask it - deliberately NOT copying
# the source wording, so pure keyword matching has no unfair advantage.
#
# `evidence`: short phrase(s) from the source that answer the question. A retrieved chunk
# counts as relevant if it contains ANY of the phrases (case/whitespace-insensitive).
# This makes the metric independent of how the text was chunked, so different chunking
# strategies can be compared on the same questions.
#
# `category`: regulation | standard | sop | sds | incident  (for per-category results)
#
# Label review: evidence lists were only ever widened where a manual review of retrieved
# chunks showed a genuinely correct answer phrased differently (marked "label review").
# Retrieval settings are never tuned against this set - that would overfit the test.

- id: R01
  category: regulation
  question: How often does a forklift driver's performance need to be re-evaluated?
  evidence: ["conducted at least once every three years"]
- id: R02
  category: regulation
  question: A forklift operator had a near miss. Do they need more training?
