# Golden set for AGENT evaluation (end-to-end answers, step 8).
#
# Fields (all checks except `reference` are scored in code):
#   question            what the user asks
#   required_tools      every tool listed must be called at least once
#   required_citations  at least ONE of these must be cited in the answer
#   must_mention        list of groups; each group passes if ANY of its phrases appears
#                       (case-insensitive) - the key facts / decision of the answer
#   must_not_mention    phrases that must NOT appear (e.g. claiming an action was sent)
#   expect_action       true: the agent must propose an email/ticket for human approval
#                       (the evaluator always REJECTS it - nothing is ever sent)
#   reference           what a correct, complete answer says - used by the LLM judge
#
# Ground truth for data questions was computed from data/dc.db with the deterministic
# tools (simulation time 2026-10-16 18:00), never written from memory.
#
# Label review: after the first run, references were corrected ONLY where checking the
# sources showed the agent's answer was right and the reference incomplete (marked
# "label review"). Agent weaknesses were fixed in the agent, never by loosening a check.

# ---------------- shipments: the planted scenarios ----------------
- id: A01
  category: shipment
  question: Is SHP-01209 OK to load tomorrow from a hazmat point of view?
  required_tools: [check_shipment_compliance]
  required_citations: ["49 CFR 177.848(d)"]
  must_mention: [["5.1"], ["class 8", "corrosive"], ["separate", "split", "move"]]
  reference: >-
    No. SHP-01209 has hydrogen peroxide (class 5.1) and caustic floor stripper (class 8),
    both fully regulated - an "O" pair in the 49 CFR 177.848 segregation table. DC policy is
    separate trailers, so the 5.1 pallets must move to another shipment. The drain opener is a
    limited quantity and is excluded from the table.

- id: A02
  category: shipment
  question: Can SHP-01210 go out tomorrow? It has pool shock and bleach on it.
  required_tools: [check_shipment_compliance]
  required_citations: ["49 CFR 177.848(a)"]
  must_mention: [["limited quantit"], ["yes", "can go", "compliant", "ok to"]]
  reference: >-
    Yes. All hazmat items on SHP-01210 (pool shock, bleach, hand sanitizer) are limited
    quantities, which are not required to bear hazard labels, so the 177.848 segregation table
    does not apply. The shipment is compliant (and not at departure risk).

- id: A03
  category: shipment
  question: Check SHP-01211 before it leaves.
  required_tools: [check_shipment_compliance]
  must_mention: [["endorse"], ["tcca", "calcium hypochlorite", "chlorine tablet"], ["reassign", "another carrier", "different carrier", "endorsed carrier"]]
  reference: >-
    Not compliant. The carrier Summit Express is not hazmat-endorsed but the load has fully
    regulated hazmat (bulk pool shock and TCCA, class 5.1), so it must be reassigned to an
    endorsed carrier. Also, calcium hypochlorite and TCCA must never be adjacent: separate
    pallets with a non-hazmat pallet or empty space between them.

- id: A04
  category: shipment
  question: Is SHP-01212 at risk of leaving late?
  required_tools: [assess_departure_risk]
  required_citations: ["SOP-OUT-002 §3.1", "SOP-OUT-002 §3.2", "SOP-OUT-002 §3-4"]
  must_mention: [["at risk", "yes"], ["trailer"], ["76", "75.6"]]
  reference: >-
    Yes, at risk. It departs 2026-10-17 05:30 with no trailer assigned (early departure
    before 08:00), and Cardinal Carriers' 30-day on-time rate is about 76%, below the 85%
    threshold. Call the carrier to confirm trailer and ETA, book a backup if not confirmed
    within an hour, notify the customer if the ETA slips more than 2 hours.

- id: A05
  category: shipment
  question: Which of tomorrow's shipments have a hazmat compliance problem?
  required_tools: [sql_query, check_shipment_compliance]
  must_mention: [["SHP-01209"]]
  reference: >-
    Of the 19 hazmat shipments planned for 2026-10-17, only SHP-01209 has a violation
    (class 5.1 + class 8 segregation). SHP-01181, SHP-01188 and SHP-01193 are compliant but
    carry calcium hypochlorite and TCCA, which must be on separate, non-adjacent pallets.

- id: A06
  category: shipment
  question: Is SHP-99999 OK to ship?
  # label review: more phrasings of "not found"
  must_mention: [["not found", "wasn't found", "was not found", "does not exist", "doesn't exist", "no shipment", "couldn't find", "could not find", "no record", "not in the"]]
  reference: >-
    Shipment SHP-99999 does not exist in the database, so it cannot be checked. The user
    should verify the shipment ID.

